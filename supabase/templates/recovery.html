<!doctype html>
<html>
  <body style="margin:0;background:#151719;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#f5f5f5">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px">
      <tr><td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#202428;border-radius:8px;padding:32px">
          <tr><td style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#a3e635;font-weight:600">MUSICED</td></tr>
          <tr><td style="padding-top:16px;font-size:22px;font-weight:600">Reset your password</td></tr>
          <tr><td style="padding-top:12px;font-size:15px;line-height:24px;color:#a3a3a3">Use the button below to choose a new password. This link expires in an hour.</td></tr>
          <tr><td style="padding-top:24px">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
               style="display:inline-block;background:#a3e635;color:#151719;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:6px">Choose a new password</a>
          </td></tr>
          <tr><td style="padding-top:24px;font-size:12px;color:#737373">If you didn't ask for this, you can ignore this email. Your password won't change.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
